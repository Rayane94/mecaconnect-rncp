name: MecaConnect availability
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
jobs:
  public-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: HTTP and JSON health check
        env:
          MECACONNECT_HEALTH_URL: https://mecaconnect-rncp-production.up.railway.app/api/health
        run: python scripts/check_health.py
