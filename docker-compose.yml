services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mecaconnect
      POSTGRES_USER: mecaconnect
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecaconnect"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mecaconnect:local-dev-only@db:5432/mecaconnect
      JWT_SECRET: ${JWT_SECRET}
      FERNET_KEY: ${FERNET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
